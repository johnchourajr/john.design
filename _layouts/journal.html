{% if type == 'post' %}

<body>

  <section class="journal__hero" style="background-color:{{post.meta.color | fallback:'rgba(77,77,77,1)'}} !important;">
    <header>
      <nav class="grid">
        <ul class="logo grid__col grid__col--1-of-12 grid__col--push-1-of-12">
          <li class="logo__svg"><a href="/"><img src="/img/logo-w.svg" alt="/"/></a></li>
        </ul>
        <ul class="nav grid__col grid__col--4-of-12 grid__col--push-5-of-12">
        {% for page in site.pages %}
          <li><a class="white" href="{{page.url}}">{{page.title}}</a></li>
        {% endfor %}
        </ul>
      </nav>
    </header>
    <figure
      data-0="background-position-y:1px;"
      data-800="background-position-y:100px;"
      class="journal__hero--img"
      {% for asset in assets %}{% if asset.meta.type == 'poster' %} style="background-image: url('{{asset.url}}');"
      {% endif %}{% endfor %}>
    </figure>
  </section>

  <section class="article__detail article__detail--work">
    <span class="article__detail--header">
      <h1>{{post.title}}</h1>
    </span>
    {{body}}
  </section>

</body>

{% endif %}
